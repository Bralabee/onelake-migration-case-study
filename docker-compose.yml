version: '3.9'
services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: onelake-migrator:latest
    container_name: onelake-migrator
    env_file:
      - config/.env
    environment:
      # Runtime overrides / defaults (safe to change)
      MIGRATION_JSON_LOGS: ${MIGRATION_JSON_LOGS:-1}
      MIGRATION_RUN_ID: ${MIGRATION_RUN_ID:-compose-prod}
      MIGRATION_LOG_DIR: /app/logs
      # Optional: override mode via MIGRATION_MODE or pass args
      MIGRATION_MODE: ${MIGRATION_MODE:-production}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--mode","${MIGRATION_MODE:-production}"]

  dashboard:
    image: onelake-migrator:latest
    container_name: onelake-dashboard
    depends_on:
      - migrator
    env_file:
      - config/.env
    environment:
      PYTHONPATH: /app/src
      MIGRATION_LOG_DIR: /app/logs
    command: ["/usr/local/bin/python","/app/src/monitoring/simple_dashboard.py","--port","8052"]
    ports:
      - "8052:8052"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro

# Quick Usage:
# Build image:        docker compose build
# NOOP test:          docker compose run --rm migrator --noop
# Turbo run:          docker compose run --rm migrator --mode turbo --concurrency 80 --batch-size 400
# Start stack:        docker compose up -d
# Tail logs:          docker compose logs -f migrator
# Override mode env:  set MIGRATION_MODE=working; docker compose up migrator
# One-off retry:      docker compose run --rm migrator --retry-failures --max-retry 300
